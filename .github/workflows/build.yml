name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s relay/tests -p "test_*.py" -v

  android:
    runs-on: ubuntu-latest
    needs: relay
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - run: |
          set -o pipefail
          gradle --no-daemon testDebugUnitTest assembleDebug 2>&1 | tee build.log
      # Surface compiler and test errors as annotations (readable without access to the logs).
      - if: failure()
        run: |
          grep -E '^e: |FAILED$|Exception|expected:' build.log | head -30 | while IFS= read -r line; do
            echo "::error::${line}"
          done
      - run: cp app/build/outputs/apk/debug/app-debug.apk "lllm-0.1.${{ github.run_number }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: lllm-apk
          path: android/lllm-*.apk
          if-no-files-found: error
      # Every push to main becomes a release, which is what Obtainium installs and updates from.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: lllm 0.1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: android/lllm-*.apk
          generate_release_notes: true
